<html>

<head>
  <meta charset="utf-8">
  <title>Type Game 4649</title>
  <style>
    div.center-text {
      text-align: center;
    }

    div.center-box {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>

  <div class="center-text">
    <div>タイプゲーム 4649</div>
  </div>
  <div class="center-text">
    <div>Press the keys that appear on the screen. Numpad recommended.</div>
  </div>
  <div class="center-text">
    <div>画面に現れる文字のキーを押してください。テンキー推奨 </div>
  </div>
  <div class="center-text">
    <div>Click the following rectangle to start the game. </div>
  </div>
  <div class="center-text">
    <div>下の四角形をクリックするとゲームが始まります。 </div>
  </div>


  <div class="center-box">
    <canvas id="myCanvas1" width="200" height="100"
      style="border:1px solid #000000; background-color: #f2f2f2;"></canvas>
  </div>
  <script>
    var width1 = 300;
    var height1 = 300;
    var canvasId = "myCanvas1";
    const canvas1 = document.getElementById(canvasId);
    const context1 = canvas1.getContext("2d");
    var framemillisec = 20;
    var frameCount = 0;
    var myBlock;
    var myBlock2;
    var enemyBlocks = [];
    var maxNumOfEne = 10;
    var endNumOfEne = 0;
    var restNumOfEne = 0;
    // var maxV = 50;
    var maxVx = width1 / 2;
    var maxVy = height1 / 2;
    var mousex;
    var mousey;
    var gameInterval;
    var gameStatus = false;
    var keydown = {}
    //var taisyoukeys = ['J','F']
    var taisyoukeys = [
      '1', '2', '3', '4', '5', '6', '7', '8', '9', '0'
    ]

    var score;


    function init() {
      canvas1.width = width1;
      canvas1.height = height1;
      canvas1.addEventListener('click', startGame, false);
      // キー押下フラグ初期化
      for (let tmpkey of taisyoukeys) {
        keydown[tmpkey] = false;
      }
      // キー判定処理登録
      window.addEventListener('keydown', function (event) {
        calckeydown(event.key);
      });

      // スコア
      score = 0;
    }


    function calckeydown(key) {
      //大文字化
      key = key.toUpperCase();
      if (taisyoukeys.includes(key)) {
        console.log(key + 'キーが押されました');
        // キーが押されたときの処理を記述
        keydown[key] = true;
      } else {
        //pass;
      }
    }

    function randint(max) {
      // 0 から max-1
      // maxの値は戻らない
      return Math.floor(Math.random() * max)
    }

    function get_randletters() {
      // 文字列をランダムに返す
      if (randint(10) < 9) {
        return "4649"
      } else {
        return "5963"
      }
    }

    function countup_score(upval = 1) {
      score += upval;
    }

    function keyhantei() {
      // 押されたキーの情報を得る。
      // 二個以上押された場合は知らん。一個だけ取り出す。
      for (tmpkey in keydown) {
        if (keydown[tmpkey]) {
          break;
        }
      }
      let imaNum = endNumOfEne - restNumOfEne;

      if (keydown[tmpkey] && enemyBlocks[imaNum].letter === tmpkey) {
        // キーが押されていて、それが文字と一緒のとき
        // スコアを上げる
        countup_score(1);
        // 敵を消す
        restNumOfEne--;
        if (restNumOfEne === 0) {
          //全部の敵を倒したので、敵を振りなおす
          set_enemyblock_attr(enemyBlocks);
        }
      } else if (keydown[tmpkey] && enemyBlocks[imaNum].letter !== tmpkey) {
        // キーが押されていて、それが文字と一緒でない
        // スコアを下げる
        countup_score(-1);
      }
      // clear key down event
      clear_allkeydown()

    }

    function clear_allkeydown() {
      // キーが押されているフラグを
      for (let tmpkey in keydown) {
        keydown[tmpkey] = false;
      }
    }

    function set_enemyblock_attr(blocks) {
      // 文字列
      letters = get_randletters();

      endNumOfEne = letters.length;
      restNumOfEne = endNumOfEne;
      for (let ii = 0; ii < letters.length; ii++) {
        blocks[ii].letter = letters[ii];
        blocks[ii].posy = 0;
        blocks[ii].vy = maxVy;

        let initialx = width1 / (endNumOfEne + 2) * (ii + 1) + (blocks[0].width / 2); // 適当に離した位置
        blocks[ii].posx = initialx;
        blocks[ii].vx = 0;
      }
    }

    function startGame() {
      if (gameStatus === false) {
        // start game
        clearCanvas();

        enemyBlocks = [];

        for (let ii = 0; ii < maxNumOfEne; ii++) {
          enemyBlocks.push(new block(30, 30, 100, 0, "#E2E2E2"));
        }

        // set attributes
        set_enemyblock_attr(enemyBlocks);

        frameCount = 0;
        // call func periodically
        gameInterval = setInterval(updateGame, framemillisec);
        gameStatus = true;
      }
    }

    function stopGame() {
      clearInterval(gameInterval);
      gameStatus = false;
      context1.textAlign = "center"
      context1.fillText("Game Over", canvas1.width / 2, 130);
    }

    function block(width, height, posx, posy, color) {
      this.width = width;
      this.height = height;
      this.posx = posx;
      this.posy = posy;
      this.color = color;
    }


    function drawEnemyBlock(block) {
      context1.fillStyle = block.color;
      context1.fillRect(block.posx, block.posy, block.width, block.height);
      context1.strokeRect(block.posx, block.posy, block.width, block.height);
      context1.fillStyle = "#000000";
      context1.font = "30px Arial";
      context1.textAlign = "center"
      context1.fillText(block.letter, block.posx + block.width / 2, block.posy + block.height * 0.9);

    }

    function clearCanvas() {
      context1.clearRect(0, 0, canvas1.width, canvas1.height);
    }


    function updateGame() {
      // //debug
      // score +=1;

      // object position
      for (let ii = endNumOfEne - restNumOfEne; ii < endNumOfEne; ii++) {
        enemyBlocks[ii].posx = enemyBlocks[ii].posx + enemyBlocks[ii].vx / 1000 * framemillisec;
        enemyBlocks[ii].posy = enemyBlocks[ii].posy + enemyBlocks[ii].vy / 1000 * framemillisec;

      }


      // key hanei
      keyhantei();

      frameCount += 1;

      clearCanvas();
      // drawBlock(myBlock);
      for (let ii = endNumOfEne - restNumOfEne; ii < endNumOfEne; ii++) {
        drawEnemyBlock(enemyBlocks[ii]);
      }
      drawScore();

      if (is_out(enemyBlocks)) {
        stopGame();
      }
    }

    function is_out(blocks) {
      // check whether block is out of the screen
      for (let ii = endNumOfEne - restNumOfEne; ii < endNumOfEne; ii++) {
        tmpx = blocks[ii].posx;
        tmpy = blocks[ii].posy;
        if (tmpx + blocks[ii].width < 0) {
          return true
        }
        if (tmpx > width1) {
          return true
        }
        if (tmpy + blocks[ii].height < 0) {
          return true
        }
        if (tmpy > height1) {
          return true
        }
      }
      return false;
    }


    function drawScore() {
      context1.fillStyle = "#000000";
      context1.font = "30px Arial";
      context1.textAlign = "right"
      context1.fillText(score, canvas1.width * 0.9, 30);
    }

    init();
  </script>

</body>

</html>
